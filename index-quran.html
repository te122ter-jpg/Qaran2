<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حفظ سورة الانشقاق</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f3ec;--card:#fff;--tx:#1f2a24;--mu:#6b756e;--ac:#1d6b4f;--ok:#1d6b4f;--bad:#b3402f;--bd:#e3ddd0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12181a;--card:#1b2427;--tx:#e9efe9;--mu:#98a69e;--ac:#4fb58c;--ok:#4fb58c;--bad:#e07a68;--bd:#2b373a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12181a;--card:#1b2427;--tx:#e9efe9;--mu:#98a69e;--ac:#4fb58c;--ok:#4fb58c;--bad:#e07a68;--bd:#2b373a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Naskh Arabic","Amiri",system-ui,sans-serif;line-height:1.7}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:4px 0 2px}
.sub{color:var(--mu);font-size:.9rem;margin-bottom:12px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
.v{font-size:1.55rem;line-height:2.3;margin:6px 0}
.n{color:var(--ac);font-size:1rem;margin-inline-start:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
button,a.b{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:#fff;text-decoration:none;cursor:pointer}
button.g,a.g{background:transparent;color:var(--ac);border:1px solid var(--ac)}
textarea{width:100%;min-height:80px;font:inherit;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:8px;box-sizing:border-box}
details{margin-top:8px;color:var(--mu)}
summary{cursor:pointer;color:var(--ac)}
#msg{margin-top:10px;white-space:pre-line}
.ok{color:var(--ok)}.bad{color:var(--bad)}
small{color:var(--mu)}
</style>
</head>
<body>
<main>
<h1>حفظ سورة الانشقاق</h1>
<div class="sub" id="sub"></div>
<div class="bar"><i id="pb" style="width:0"></i></div>
<div class="card" id="portion"></div>
<div class="card" id="rec">
<b>التسميع</b>
<div class="row"><button id="mic">🎙️ ابدأ التسميع</button></div>
<textarea id="txt" lang="ar" dir="rtl" placeholder="يظهر هنا نص تسميعك. يمكنك أيضًا الإملاء بميكروفون لوحة المفاتيح."></textarea>
<label style="display:block;margin-top:8px;font-size:.9rem"><input type="checkbox" id="snd" checked> تحقّق من تلاوتي بتسجيل صوتي يُرسل إلى صاحب التطبيق (عبر تيليغرام)</label>
<div class="row"><button id="cmp">قارن</button><button class="g" id="skip">تخطَّ المقطع</button><button class="g" id="rst">ابدأ من جديد</button></div>
<div id="msg"></div>
<small>المقارنة آلية وقد تخطئ في التعرف على الكلمات، فراجع حفظك مع معلّم متقن.</small>
</div>
<div class="card">
<b>الإشعارات على أندرويد</b>
<p style="margin:6px 0">ثبّت تطبيق <b>ntfy</b> ثم اشترك في الموضوع: <b dir="ltr">inshiqaq-7k2m9xq4dz</b></p>
<a class="b g" href="https://ntfy.sh/inshiqaq-7k2m9xq4dz" target="_blank" rel="noopener">فتح صفحة الاشتراك</a>
</div>
</main>
<script>
var V=["إِذَا السَّمَاءُ انْشَقَّتْ","وَأَذِنَتْ لِرَبِّهَا وَحُقَّتْ","وَإِذَا الْأَرْضُ مُدَّتْ","وَأَلْقَتْ مَا فِيهَا وَتَخَلَّتْ","وَأَذِنَتْ لِرَبِّهَا وَحُقَّتْ","يَا أَيُّهَا الْإِنْسَانُ إِنَّكَ كَادِحٌ إِلَىٰ رَبِّكَ كَدْحًا فَمُلَاقِيهِ","فَأَمَّا مَنْ أُوتِيَ كِتَابَهُ بِيَمِينِهِ","فَسَوْفَ يُحَاسَبُ حِسَابًا يَسِيرًا","وَيَنْقَلِبُ إِلَىٰ أَهْلِهِ مَسْرُورًا","وَأَمَّا مَنْ أُوتِيَ كِتَابَهُ وَرَاءَ ظَهْرِهِ","فَسَوْفَ يَدْعُو ثُبُورًا","وَيَصْلَىٰ سَعِيرًا","إِنَّهُ كَانَ فِي أَهْلِهِ مَسْرُورًا","إِنَّهُ ظَنَّ أَنْ لَنْ يَحُورَ","بَلَىٰ إِنَّ رَبَّهُ كَانَ بِهِ بَصِيرًا","فَلَا أُقْسِمُ بِالشَّفَقِ","وَاللَّيْلِ وَمَا وَسَقَ","وَالْقَمَرِ إِذَا اتَّسَقَ","لَتَرْكَبُنَّ طَبَقًا عَنْ طَبَقٍ","فَمَا لَهُمْ لَا يُؤْمِنُونَ","وَإِذَا قُرِئَ عَلَيْهِمُ الْقُرْآنُ لَا يَسْجُدُونَ","بَلِ الَّذِينَ كَفَرُوا يُكَذِّبُونَ","وَاللَّهُ أَعْلَمُ بِمَا يُوعُونَ","فَبَشِّرْهُمْ بِعَذَابٍ أَلِيمٍ","إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ لَهُمْ أَجْرٌ غَيْرُ مَمْنُونٍ"]
var T=[[1,5,"إذا السماء تصدعت وانشقت بأمر الله، وأطاعت ربها فيما أمرها به، وحق لها أن تطيع. وإذا الأرض بُسطت، وأخرجت ما في داخلها من الموتى وغيرهم، وتخلّت عنهم، وأطاعت ربها فيما أمرها به."],[6,9,"يا أيها الإنسان، إنك تسعى بعملك في هذه الحياة إلى ربك، ثم تلقاه ويجازيك بعملك؛ فأما من أُعطي كتاب أعماله بيمينه، فسوف يحاسَب حسابًا سهلًا، ويرجع إلى أهله في الجنة مسرورًا."],[10,15,"وأما من أُعطي كتابه من وراء ظهره، فسوف يتمنى الهلاك، ويدخل النار؛ لأنه كان في أهله فرحًا بالدنيا، وظن أنه لن يرجع إلى الله للحساب. بلى، إن ربه كان مطّلعًا عليه."],[16,19,"يقسم الله بالشفق، وبالليل وما جمعه، وبالقمر إذا اكتمل، لتنتقلنّ أيها الناس من حال إلى حال ومن مرحلة إلى مرحلة."],[20,25,"فما الذي يمنع المكذبين من الإيمان؟ وإذا قُرئ عليهم القرآن لا يخضعون لله. بل يكذبون، والله أعلم بما يخفونه في صدورهم؛ فأنذرهم بعذاب أليم، إلا الذين آمنوا وعملوا الصالحات، فلهم ثواب دائم غير منقطع."]]
var PER=2,K="inshiqaq-i",i=0,sr=null,rc=null,ch=[],blob=null,stream=null,HOOK="https://abw1212.app.n8n.cloud/webhook/quran-recitation-telegram-7k2m9xq4dz";
try{i=parseInt(localStorage.getItem(K)||"0",10)||0}catch(e){}
function $(id){return document.getElementById(id)}
function save(){try{localStorage.setItem(K,String(i))}catch(e){}}
function norm(s){return String(s||"").replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g,"").replace(/[\u0623\u0625\u0622\u0671]/g,"\u0627").replace(/\u0649/g,"\u064A").replace(/\u0629/g,"\u0647").replace(/[^\u0621-\u064A\s]/g," ").replace(/\s+/g," ").trim()}
function render(){
  var done=i>=V.length,end=Math.min(i+PER,V.length);
  $("pb").style.width=Math.round(i/V.length*100)+"%";
  $("sub").textContent=done?"اكتمل حفظ السورة":"المقطع الحالي: الآيات "+(i+1)+(end>i+1?" – "+end:"")+" من "+V.length;
  var h="";
  if(done){h='<div class="v ok">ما شاء الله، أتممت حفظ سورة الانشقاق 🎉</div>';$("rec").style.display="none"}
  else{
    $("rec").style.display="";
    for(var k=i;k<end;k++){var ayahNo=String(k+1).padStart(3,"0");var u="https://everyayah.com/data/Alafasy_128kbps/084"+ayahNo+".mp3";
      h+='<div class="v">'+V[k]+'<span class="n">﴿'+(k+1)+'﴾</span></div><audio controls preload="none" src="'+u+'" style="width:100%"></audio><div><a class="b g" href="'+u+'" target="_blank" rel="noopener" style="display:inline-block;margin-top:6px">فتح التلاوة</a></div>'}
    var seen={};h+='<details><summary>التفسير الميسر</summary>';
    for(var k2=i;k2<end;k2++){for(var g=0;g<T.length;g++){if(k2+1>=T[g][0]&&k2+1<=T[g][1]&&!seen[g]){seen[g]=1;h+='<p><b>الآيات '+T[g][0]+(T[g][1]>T[g][0]?"–"+T[g][1]:"")+':</b> '+T[g][2]+'</p>'}}}
    h+='</details>'}
  $("portion").innerHTML=h;
}
function say(t,c){var m=$("msg");m.textContent=t;m.className=c||""}
function compare(){
  stopRec();
  var exp=norm(V.slice(i,i+PER).join(" ")).split(" ").filter(Boolean),got=norm($("txt").value).split(" ").filter(Boolean);
  if(!got.length){say("اكتب تسميعك أو سجّله أولًا.","bad");return}
  var n=exp.length,m=got.length,dp=[],a,b;
  for(a=0;a<=n;a++){dp.push(new Array(m+1).fill(0))}
  for(a=1;a<=n;a++){for(b=1;b<=m;b++){dp[a][b]=exp[a-1]===got[b-1]?dp[a-1][b-1]+1:Math.max(dp[a-1][b],dp[a][b-1])}}
  var ok=new Array(n).fill(false);a=n;b=m;
  while(a>0&&b>0){if(exp[a-1]===got[b-1]){ok[a-1]=true;a--;b--}else if(dp[a-1][b]>=dp[a][b-1]){a--}else{b--}}
  var miss=exp.filter(function(w,k){return !ok[k]}),pct=Math.round((n-miss.length)/n*100);
  if(pct>=90){i=Math.min(i+PER,V.length);save();$("txt").value="";render();say("✅ أحسنت! تطابق تسميعك "+pct+"%. انتقلنا للمقطع التالي.","ok")}
  else{say("نسبة التطابق "+pct+"%."+(miss.length?"\nكلمات لم أتبيّنها: "+miss.slice(0,10).join("، "):"")+"\nأعد المحاولة.","bad")}
}
$("cmp").onclick=compare;
$("skip").onclick=function(){i=Math.min(i+PER,V.length);save();$("txt").value="";say("");render()};
$("rst").onclick=function(){i=0;save();$("txt").value="";say("");render()};
function stopRec(){}
function micRecord(){
  if(rc&&rc.state==="recording"){rc.stop();return}
  if(!navigator.mediaDevices||!window.MediaRecorder){say("التسجيل غير مدعوم في هذا المتصفح. ألغِ التأشير واستخدم الإملاء.","bad");return}
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){
    ch=[];stream=st;rc=new MediaRecorder(st);
    rc.ondataavailable=function(e){if(e.data&&e.data.size){ch.push(e.data)}};
    rc.onstop=function(){
      try{stream.getTracks().forEach(function(t){t.stop()})}catch(x){}
      $("mic").textContent="🎙️ ابدأ التسميع";
      var b=new Blob(ch,{type:rc.mimeType||"audio/webm"});
      if(b.size<1500){say("لم يُسجَّل صوت. حاول مرة أخرى.","bad");return}
      upload(b);
    };
    rc.start();$("mic").textContent="⏹️ إيقاف التسجيل";say("جارٍ التسجيل... اقرأ المقطع ثم اضغط إيقاف.");
  }).catch(function(e){say("تعذّر الوصول للميكروفون ("+(e&&e.name?e.name:"")+"). اسمح للمتصفح باستخدام الميكروفون.","bad")});
}
function upload(b){
  var f=new FormData();
  f.append("expected",V.slice(i,i+PER).join(" "));f.append("verses",(i+1)+"-"+Math.min(i+PER,V.length));f.append("audio",b,"recitation.webm");
  say("جارٍ التحقق من تلاوتك...");$("mic").disabled=true;
  fetch(HOOK,{method:"POST",body:f}).then(function(r){return r.json()}).then(function(d){
    $("mic").disabled=false;
    if(!d){say("لم تصل استجابة صحيحة من الخادم.","bad");return}
    if(d.sentToTelegram===true){say("✅ تم إرسال التسجيل الصوتي إلى تيليغرام بنجاح.","ok");return}
    if(d.ok!==true){say("تعذّر إرسال التسجيل إلى تيليغرام. تحقق من إعدادات n8n.","bad");return}
    $("txt").value=d.spoken||"";
    var pct=parseInt(d.pct,10)||0;
    if(d.passed===true||d.passed==="true"){i=Math.min(i+PER,V.length);save();render();say("✅ أحسنت! تطابق تسميعك "+pct+"%. انتقلنا للمقطع التالي.","ok")}
    else{say("نسبة التطابق "+pct+"%."+(d.missing?"\nكلمات لم أتبيّنها: "+d.missing:"")+"\nأعد المحاولة.","bad")}
  }).catch(function(){$("mic").disabled=false;say("تعذّر الاتصال بالخادم. حاول لاحقًا.","bad")});
}
$("mic").onclick=function(){
  if($("snd").checked){micRecord();return}
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(sr){sr.stop();return}
  if(!SR){say("التعرف على الصوت غير متاح هنا. استخدم ميكروفون لوحة المفاتيح للإملاء في المربع.","bad");return}
  sr=new SR();sr.lang="ar-SA";sr.continuous=true;sr.interimResults=false;
  sr.onresult=function(e){var s2=[];for(var k=0;k<e.results.length;k++){s2.push(e.results[k][0].transcript)}$("txt").value=s2.join(" ")};
  sr.onerror=function(e){var c=e&&e.error?e.error:"";say("تعذّر التسجيل ("+c+"). حاول مرة أخرى أو استخدم الإملاء من لوحة المفاتيح.","bad");sr=null;$("mic").textContent="🎙️ ابدأ التسميع"};
  sr.onend=function(){sr=null;$("mic").textContent="🎙️ ابدأ التسميع"};
  try{sr.start();$("mic").textContent="⏹️ إيقاف التسجيل";say("")}catch(e){sr=null;say("تعذّر بدء التسجيل.","bad")}
};
render();
</script>
</body>
</html>
